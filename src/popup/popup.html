<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>微信推文关键信息提取器</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    width: 380px; margin: 0; padding: 0;
    font: 13px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #1f2329; background: #fff;
  }
  header { padding: 12px 14px; background: #f7f8fa; border-bottom: 1px solid #eceef1; }
  h1 { margin: 0; font-size: 13px; font-weight: 700; }
  .sub { margin-top: 4px; font-size: 11px; color: #8a9099; }
  .body { max-height: 460px; overflow-y: auto; padding: 12px 14px; }
  .empty { color: #8a9099; font-size: 12px; }
  table.kv { width: 100%; border-collapse: collapse; }
  table.kv td { padding: 5px 0; vertical-align: top; border-bottom: 1px dashed #f0f1f3; }
  table.kv td.k { width: 70px; color: #8a9099; white-space: nowrap; }
  .link { display: block; color: #0b6bcb; text-decoration: none; word-break: break-all; font-size: 12px; margin: 6px 0 2px; }
  .link:hover { text-decoration: underline; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; background: #e8f7ee; color: #05874a; margin-right: 4px; }
  .tag.warn { background: #fff4e5; color: #b76b00; }
  .warn { padding: 8px 10px; border-radius: 6px; background: #fff8e6; border: 1px solid #ffe2a8; color: #8a6100; font-size: 11.5px; margin-bottom: 6px; }
  footer { padding: 10px 14px; border-top: 1px solid #eceef1; background: #f7f8fa; display: flex; flex-wrap: wrap; gap: 6px; }
  button { border: 1px solid #d8dbe0; background: #fff; color: #1f2329; border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }
  button:hover { border-color: #07c160; color: #05874a; }
  button.primary { background: #07c160; border-color: #07c160; color: #fff; font-weight: 600; }
  button.primary:hover { background: #05a352; color: #fff; }
  button.wide { flex: 1 1 100%; }
  .toast { position: fixed; left: 50%; bottom: 14px; transform: translate(-50%, 8px); background: rgba(31,35,41,.92); color: #fff;
           padding: 7px 14px; border-radius: 8px; font-size: 12px; opacity: 0; transition: .18s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  h2 { font-size: 12px; color: #5b6270; margin: 12px 0 6px; }
  h2:first-child { margin-top: 0; }
  .typebox { margin-bottom: 4px; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700;
           background: #eef2ff; color: #3b5bdb; }
  .badge.recruit { background: #e8f7ee; color: #05874a; }
  .badge.literature { background: #f3ecff; color: #6b3fd4; }
  .badge.general { background: #f2f3f5; color: #6b7280; }
  .badge.hybrid { background: #fff4e5; color: #b76b00; }
  pre.cite { margin: 0; padding: 8px 10px; background: #f7f8fa; border: 1px solid #eceef1; border-radius: 6px;
             font: 11.5px/1.6 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-word; color: #24292f; }
</style>
</head>
<body>
  <header>
    <h1>微信推文关键信息提取器</h1>
    <div class="sub" id="sub">正在读取当前页面…</div>
  </header>

  <div class="body" id="body">
    <div class="empty">正在提取…</div>
  </div>

  <footer>
    <button class="primary" id="btn-md">复制 Markdown</button>
    <button id="btn-json">复制 JSON</button>
    <button id="btn-links">复制投递链接</button>
    <button class="wide" id="btn-panel">在页面上打开完整面板</button>
    <button class="wide" id="btn-batch">批量提取多个链接…</button>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="../core/rules.js"></script>
  <script src="../core/parse.js"></script>
  <script src="../core/fields.js"></script>
  <script src="../core/format.js"></script>
  <script src="../core/extract.js"></script>
  <script src="popup.js"></script>
</body>
</html>
